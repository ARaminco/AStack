project:
  name: AStack Enterprise
  product: AI Operating System for Any Practice
  version: 3.0.0
  philosophy: enterprise_modular_platform
  primary_runtime: claude-code
  compatibility:
    claude_code: true
    openai_codex: true
    chatgpt: true
    markdown_first: true

language:
  supported_locales:
    - fa
    - en
    - ar
    - tr
  fallback_locale: en
  conversation: fa
  ui: fa
  explanations: fa
  reports: fa
  planning: fa
  architecture: fa
  review: fa
  progress: fa
  questions: fa
  errors: fa
  code: en
  comments: en
  commits: en
  documentation: en
  variables: en
  classes: en
  functions: en
  database: en
  api: en

documentation_language:
  default: en
  secondary: fa

architecture:
  layers:
    - core
    - runtime
    - chief-of-staff
    - orchestrator
    - context-engine
    - knowledge-graph
    - learning-engine
    - mission-engine
    - scheduler-engine
    - signal-engine
    - browser-engine
    - tool-registry
    - runtime-providers
    - trust-engine
    - domains
    - departments
    - roles
    - teams
    - agents
    - providers
    - knowledge-packs
    - plugins
    - memory-engine
    - workflow-engine
    - delivery-engine
    - team-engine
    - agent-engine
    - interop-engine
    - upgrade-engine
    - localization-engine
    - configuration-engine
    - event-bus
    - permission-system
    - cli
    - installer
    - documentation
    - testing
    - telemetry

models:
  default_ai_model: claude-sonnet-4
  routing:
    planning: claude-sonnet-4
    coding: claude-code
    review: claude-sonnet-4
    local: ollama
  providers:
    claude_code:
      enabled: true
      default_model: claude-sonnet-4
    openai:
      enabled: true
      default_model: gpt-5
    codex:
      enabled: true
      default_model: gpt-5-codex
    gemini:
      enabled: true
      default_model: gemini-2.5-pro
    openrouter:
      enabled: true
      default_model: openrouter/auto
    ollama:
      enabled: true
      default_model: llama3.1
      base_url: http://localhost:11434
    deepseek:
      enabled: true
      default_model: deepseek-chat
    local_models:
      enabled: true
      default_model: local/default

localization:
  service: localization-engine/service.mjs
  translations: locales
  global_policy: system/language-policy.md
  fallback_enabled: true

memory:
  enabled: true
  import_paths:
    - memory
  import_exclude: []
  engine: memory-engine/memory-engine.mjs
  directory: memory
  scopes:
    - global
    - project
    - department
    - role
    - team
    - agent
    - decision
    - coding-standards
    - architecture
    - business
    - user-preferences

delivery:
  enabled: true
  engine: delivery-engine/project-engine.mjs
  storage: .astack/projects
  templates: delivery-engine/templates.json
  defaults:
    sprint_length_days: 14
    sprint_capacity: 20
    wip_limits:
      in-progress: 3
      in-review: 2
  health:
    green_threshold: 75
    amber_threshold: 50
    stale_item_days: 14
  forecasting:
    method: monte-carlo-throughput
    runs: 5000
    seed: 42
  estimation:
    method: pert-three-point
    calibration_scope: decision

domains:
  enabled: true
  registry: domains/domains.json
  engine: domains/domain-registry.mjs
  detection: keyword-scoring
  languages:
    - fa
    - en

teams:
  enabled: true
  engine: team-engine/team-engine.mjs
  storage: .astack/teams
  assembly: domain-blueprint
  statuses:
    - forming
    - active
    - paused
    - disbanded

agents:
  enabled: true
  engine: agent-engine/agent-engine.mjs
  leadership: agent-engine/leadership.mjs
  storage: .astack/agents
  provider_default: claude-code
  scheduling:
    intervals:
      - 30m
      - 1h
      - 4h
      - 1d
      - 1w
    dispatch: work-order
    outbox: .astack/agents/<agent>/outbox
  supervision:
    standup: astack lead standup
    review: astack lead review

upgrade:
  enabled: true
  engine: upgrade-engine/upgrade-engine.mjs
  manifest: upgrade-engine/manifest.json
  source: https://github.com/ARaminco/AStack.git
  channel: stable
  pipeline: upgrade-engine/update-pipeline.mjs
  canonical_core: ~/.astack/core
  cache: .astack/cache/upstream
  backups: .astack/backups
  standalone: scripts/astack-upgrade.mjs
  keep: []

plugins:
  enabled: true
  directory: plugins
  manifest: plugin.json

telemetry:
  enabled: false
  mode: local-summary

security:
  permissions:
    default: least_privilege
    policy: permission-system/policy.mjs
  secrets:
    storage: environment_variables
    commit_allowed: false

cli:
  default_locale: fa
  commands:
    - init
    - install
    - doctor
    - upgrade
    - update
    - review
    - ask
    - standup
    - owner
    - context
    - memory
    - graph
    - learn
    - skill
    - mission
    - schedule
    - signal
    - browser
    - authority
    - approval
    - audit
    - secret
    - tool
    - runtime
    - domain
    - team
    - agent
    - lead
    - project
    - workflow
    - provider
    - plugin
    - knowledge
    - backup

context:
  enabled: true
  engine: context-engine/context-engine.mjs
  router: context-engine/context-router.mjs
  lenses: context-engine/lenses.json
  storage: .astack/context
  owner_capsule_budget: 800
  memory_budget: 2500
  project_budget: 3500
  repo_map_budget: 2000
  skill_budget: 3000
  tool_catalog_budget: 500
  retrieval_budget: 12000
  max_files: 8
  refresh: auto

graphify:
  enabled: true
  package: graphifyy
  output: graphify-out
  query_budget: 1500
  max_budget: 4000
  git_hooks: true

graph:
  enabled: true
  engine: knowledge-graph/graph-engine.mjs
  backend: file
  storage: .astack/graph
  temporal: true

learning:
  enabled: true
  engine: learning-engine/learning-engine.mjs
  catalog: learning-engine/skill-catalog.mjs
  storage: .astack/learning
  skills: skills/learned
  auto_extract_lessons: true
  auto_create_skill_candidates: true
  auto_promote_skills: false
  min_occurrences: 3
  min_distinct_days: 2
  min_success_rate: 0.6

# Skill hub (skill-hub/): auxiliary third-party skill packs in skill-packs/.
# Optional; these are the defaults when the section is absent.
# skills:
#   packs:
#     enabled: true            # false hides every pack from search, catalog and ask
#     weight: 0.6              # auxiliary weight; packs always rank below built-in and learned skills
#     runtime_penalty: 0.5     # extra factor for skills tied to another agent runtime (compat: hermes-runtime)
#     review_penalty: 0.8      # extra factor for skills whose scan risk is high
#     update_check: false      # daemon service: periodically compare git-sourced packs with upstream (check only)
#     update_check_hours: 24

runtime:
  default: claude-code
  registry: runtime-providers/agent-runtime.mjs
  model_router: runtime-providers/model-router.mjs
  providers:
    claude-code:
      enabled: true
    codex:
      enabled: true
    mock:
      enabled: true

interop:
  enabled: true
  # project_root: ..        # when the core lives in a subfolder of the project the runtimes open
  engine: interop-engine/interop-engine.mjs
  contract: AGENTS.md
  journal: .astack/interop/journal.jsonl
  mcp_server: astack
  runtimes:
    claude-code:
      instructions: CLAUDE.md
      mcp: .mcp.json
      hooks: .claude/settings.json
    codex:
      instructions: AGENTS.md
      mcp: .codex/config.toml
      hooks: .codex/hooks.json

tools:
  registry: tool-registry/tool-registry.mjs
  manifest: tool-registry/tools.json
  custom: .astack/tools
  progressive_disclosure: true

missions:
  enabled: true
  engine: mission-engine/mission-engine.mjs
  storage: .astack/missions
  resumable: true

scheduler:
  enabled: true
  engine: scheduler-engine/scheduler-engine.mjs
  storage: .astack/scheduler
  tick_interval: 60s
  default_timeout_ms: 30000
  default_retries: 1

signals:
  enabled: true
  engine: signal-engine/signal-engine.mjs
  storage: .astack/signals
  server:
    host: 127.0.0.1
    port: 8787
    require_signature: true
    rate_limit_per_minute: 60
    # allow_remote: false   # true is needed to bind anything but loopback

browser:
  enabled: true
  engine: browser-engine/browser-engine.mjs
  preferred_driver: cdp
  persistent_profiles: true
  storage: .astack/browser
  evidence: .astack/evidence
  headless_default: true
  stop_before_commit: true

authority:
  default_level: L2
  autonomous:
    - L0
    - L1
    - L2
  require_approval:
    - L4
  policy: .astack/security/authority.json

audit:
  enabled: true
  engine: trust-engine/audit.mjs
  storage: .astack/audit
  approvals: .astack/approvals

secrets:
  broker: trust-engine/secrets.mjs
  registry: .astack/security/credentials.json
  source: environment_variables
  reference_scheme: credential://<provider>/<name>

# Unattended runner (AStack 3.0). Optional: every value below is the default
# used when the section is absent. Spawned engines must also pass the
# automation policy: astack schedule policy allow-command claude
# runner:
#   default_engine: auto          # auto | claude | codex | ollama | mock
#   daily_budget_usd: 5           # refuse new runs once today's spend reaches this
#   per_run_budget_usd: 1         # passed to claude as --max-budget-usd
#   max_concurrent: 1
#   timeout: 15m
#   poll_interval: 15s            # how often the daemon drains the queue
#   brief_budget: 6000            # context tokens in the work order
#   local_brief_budget: 2500      # smaller work order for the local model
#   # auto: model-router tier -> engine
#   routing:
#     fast: ollama
#     standard: claude
#     strong: claude
#     coding: claude
#   claude:
#     command: claude
#     permission_mode: dontAsk    # one of default, dontAsk, acceptEdits, plan
#     # read-only by default; wider tools apply only at ceiling L3+ for the
#     # owner's own requests (cli, console, gateway). A2A and signal runs are
#     # always Read/Grep/Glob. Writes to .astack/ and `astack approval` are
#     # always denied, whatever disallowed_tools says.
#     allowed_tools:
#       - Read
#       - Grep
#       - Glob
#     tools: null                 # built-in tools loaded; null = derived from allowed_tools
#     strict_mcp: true            # load no MCP servers ...
#     mcp_config: null            # ... unless this file names some
#     skills: false               # --disable-slash-commands unless true
#     model: null
#   codex:
#     command: codex
#     sandbox: read-only          # danger-full-access is refused; forced to read-only below L3
#     args: []                    # --yolo, --dangerously-bypass-approvals-and-sandbox, -c sandbox_mode=... are refused
#   ollama:
#     url: http://127.0.0.1:11434 # loopback; any other host must pass the network policy
#     model: null                 # null = first installed chat model

# One background process for runner, scheduler and webhooks (AStack 3.0).
# daemon:
#   # default: every <engine>/service.mjs that exists
#   services:
#     - runner-engine
#     - scheduler-engine
#     - signal-engine
#   restart_backoff_ms: 1000
#   restart_backoff_max_ms: 60000
#   health_interval_ms: 5000
#   windows_launcher: conhost-headless   # or: direct
#   scheduler-engine:
#     interval: 60s               # default: scheduler.tick_interval
#   signal-engine:
#     port: 8787                  # default: signals.server

# Smarter recall (AStack 3.0, P3). Optional: every value below is the default
# used when the section is absent. Uncomment to change one.
# search:
#   enabled: true
#   storage: .astack/search
#   backend: auto              # auto (node:sqlite FTS5, JSON fallback) | json
#   sources:                   # what reindex covers
#     - memory
#     - sessions
#     - reports
#     - skills
#     - missions
#   default_sources:           # what a query searches when --source is absent
#     - memory
#     - sessions
#     - reports
#     - skills
#   k: 10
#   budget: 1200               # tokens for rendered results
#   hooks: true                # memory/context search add "also found in past sessions"
#   reindex_every: 15m         # daemon service interval
#   semantic:
#     mode: auto               # auto | on | off
#     url: http://127.0.0.1:11434
#     model: bge-m3
#     batch_size: 16
#     min_similarity: 0.35
#   sessions:
#     claude: true             # ~/.claude/projects/<workspace slug>/*.jsonl
#     codex: true              # ~/.codex/sessions/**, filtered by working directory
#     project_roots: []        # default: this workspace only
#   reports:
#     paths:                   # memory.import_paths are always added
#       - documentation
#     exclude: []

# --- AStack 3.0 (P6) — all optional; the defaults below apply when absent.
# board:                          # multi-agent kanban (board-engine)
#   max_parallel: 2               # cards run at once per board
#   max_retries: 2                # retries after the first failed attempt
#   backoff_ms: 2000              # first retry delay; doubles each retry
#   backoff_max_ms: 300000
#   max_review_rounds: 2          # reviewer rejections before the card fails
#   tick_ms: 15000                # daemon service tick
#   ceiling: null                 # authority ceiling passed to the runner (null: runner default)
#   engine: auto
# sandbox:                        # Docker-isolated execution (sandbox-engine)
#   image: node:22-alpine
#   network: none                 # none | bridge
#   memory: 512m
#   cpus: "1"
#   pids_limit: 128
#   timeout_ms: 120000
#   user: "65534:65534"
#   allow_inline_eval_when_isolated: true
#   allow_mounts_outside_workspace: false
#   docker: docker
#   # Routing shell commands into the sandbox is an automation-policy setting:
#   # astack sandbox require <pattern>  (sandbox.required_for in .astack/security/automation.json)
# vault:                          # OS keychain backends for credential://… references
#   # Register a reference with --source vault:windows | vault:macos | vault:linux |
#   # vault:bitwarden | vault:1password, then: astack secret vault set <ref>
# a2a:                            # Agent-to-Agent endpoint (interop-engine/a2a-server.mjs)
#   host: 127.0.0.1               # loopback only unless allow_remote is true
#   port: 41241
#   path: /a2a
#   ceiling: L1                   # capped by authority.default_level, never above L3
#   execute: false                # plan only; true lets the runner execute (read-only tools)
#   allow_remote: false
#   public_url: null              # URL advertised in the agent card
#   # Bearer token: credential://a2a/token

# Owner messaging gateway (AStack 3.0, gateway-engine/). Optional: everything
# below is the default when the section is absent. Uncomment to enable.
# Owner ids are placeholders; keep real numbers out of a committed file with
# `astack gateway owner add <channel> <id>` (stored in .astack/gateway/owners.json).
# gateway:
#   enabled: false
#   language: fa
#   poll_interval_s: 5
#   long_poll_s: 25
#   max_inbound_age_s: 600
#   rate_limit_per_minute: 20
#   send_spacing_ms: 800
#   send_level: L2
#   ack: true
#   single_pending_without_code: true   # private chats only; groups always need a quote or the code
#   approval_window_minutes: 30         # a bare «بفرست» counts only for a prompt sent to that chat this recently
#   owners:
#     telegram:
#       - "100000001"
#       - "100000002"
#     whatsapp-wapi:
#       - "15550000001"
#     whatsapp-bridge:
#       - "15550000001"
#     whatsapp-cloud:
#       - "15550000001"
#   groups:
