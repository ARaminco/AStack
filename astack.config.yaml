#       - "120000000000000000@g.us"
#   listener:
#     host: 127.0.0.1
#     port: 8788
#     allow_remote: false         # true is needed to bind anything but loopback
#   channels:
#     telegram:
#       enabled: false
#       token: credential://telegram/bot
#     whatsapp-wapi:
#       enabled: false
#       base_url: http://127.0.0.1:3000
#       token: credential://wapi/channel
#     whatsapp-bridge:
#       enabled: false
#       port: 8790
#     whatsapp-cloud:
#       enabled: false
#       phone_number_id: "000000000000000"
#       waba_id: "000000000000000"
#       api_version: v21.0
#       access_token: credential://whatsapp-cloud/access-token
#       app_secret: credential://whatsapp-cloud/app-secret
#       verify_token: credential://whatsapp-cloud/verify-token
#   voice:
#     enabled: true
#     model: large-v3-turbo
#     language: fa
#     device: auto
#     python: python
#     timeout_s: 300
#     allow_approvals: false

# Aramin, the AStack console (`astack console start`). Optional: every value
# below is the default used when this section is absent.
# console:
#   enabled: true            # false keeps the daemon from starting it
#   host: 127.0.0.1          # loopback only; anything else needs --host or allow_remote
#   port: 7717
#   allow_remote: false      # let the daemon bind a non-loopback host from this file
#   allowed_hosts: []        # extra Host header names accepted on loopback (e.g. a local DNS name)
#   poll_interval: 3s        # how often durable state is compared for live updates
#   session_days: 30         # how long a signed-in device stays signed in
#   locale: fa               # default UI language (fa | en); the app remembers the owner's choice
